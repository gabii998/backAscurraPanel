name: Build Docker Image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necesario para escribir en GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Normalize image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        shell: bash
        run: |
          image="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
          ref_name="$(printf '%s' "${GITHUB_REF_NAME,,}" | sed -E 's/[^a-z0-9_.-]+/-/g')"

          {
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA::7}"
            echo "${image}:${ref_name}"
            if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
              echo "${image}:latest"
            fi
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "${image}:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: . # El contexto de construcción, usualmente el directorio raíz del repositorio
          file: ./Dockerfile # Ruta a tu Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          #cache-from: type=gha # Habilita el caché para construcciones más rápidas
          #cache-to: type=gha,mode=max # Guarda el caché para futuras construcciones
